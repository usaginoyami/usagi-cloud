name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar rclone para Android arm64
        run: |
          git clone --depth 1 https://github.com/rclone/rclone /tmp/rclone
          cd /tmp/rclone
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64
          go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/librclone.so" .
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mv "$GITHUB_WORKSPACE/librclone.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/librclone.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UsagiCloud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
