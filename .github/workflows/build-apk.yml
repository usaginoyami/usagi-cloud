name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar rclone para Android arm64
        run: |
          git clone --depth 1 https://github.com/rclone/rclone /tmp/rclone
          cd /tmp/rclone
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64
          go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/librclone.so" .
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mv "$GITHUB_WORKSPACE/librclone.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/librclone.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/usagicloud.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/usagicloud.jks"
            TASK=assembleRelease
          else
            echo "::warning::Sem chave fixa: APK de debug (precisa desinstalar o antigo para atualizar)."
            TASK=assembleDebug
          fi
          gradle $TASK --no-daemon 2>&1 | tee build.log || {
            # mostra os erros de compilação como anotações visíveis na página do build
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Conferir se o rclone entrou no APK
        run: |
          APK=$(ls app/build/outputs/apk/*/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/arm64-v8a/librclone.so" || { echo "ERRO: librclone.so não está no APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: UsagiCloud-apk
          path: app/build/outputs/apk/*/*.apk
